# ==============================================================================
# Vultr remote-training configuration (consumed by `ysp-vultr`).
# The API key is read ONLY from the VULTR_API_KEY environment variable and is
# never stored here, so this file is safe to commit. Edit the values below, then:
#
#   export VULTR_API_KEY=...
#   ysp-vultr plans            # discover a GPU plan id + confirm it has enough VRAM
#   ysp-vultr launch           # provision -> download -> TRIBE -> train -> checkpoints -> halt
# ==============================================================================

# ---- Infrastructure ----
region: ewr                       # Vultr region code (ewr=New Jersey, lax, ...)
plan: ""                          # GPU plan id from `ysp-vultr plans` (REQUIRED).
                                  # TRIBE v2 is ~1B params — choose >= 24 GB VRAM.
os_label: "Ubuntu 24.04 LTS x64"
block_size_gb: 100                # persistent storage for videos + tensors + ckpts
label: ysp-train                  # names the instance AND the block volume
ssh_key_path: ~/.ssh/id_ed25519.pub
ssh_user: root

# ---- Source: Mac -> GitHub -> Vultr ----
repo_url: ""                      # e.g. https://github.com/<you>/youtube-success-predictor (REQUIRED)
branch: main

# ---- Persistent storage mount on the instance ----
mount_point: /mnt/ysp-data

# ---- Pipeline inputs ----
dataset_source: ""                # a video / playlist / channel URL to ingest
dataset_limit: null               # cap number of videos (null = all)
train_overrides:                  # Hydra overrides forwarded to ysp-train
  - training.epochs=100
  - training.resume=auto          # pick up the latest checkpoint after interruptions
pipeline_skip: []                 # e.g. ["download"] to reuse an existing dataset

# ---- Lifecycle ----
auto_halt: true                   # stop compute billing when the job finishes
auto_destroy: false               # destroy the instance (block storage is retained)
